name: Continous Integration tests

# Every change gets up to three CMake builds (Linux, Windows, then macOS) of the
# release configuration (with the Test bundle), each installed and followed by a
# plugin load test of the install tree. The Linux build is also followed by a
# headless render test (.github/tools/rendertest.sh, with openfx's hostDemo,
# built with -DOFX_BUILD_HOSTDEMO=ON) and a smoke test that renders every plug-in
# (.github/tools/smoketest.sh); nightly.yml runs them on macOS too. macOS runs
# only after Linux and Windows pass, and is informative: a red or missing macOS
# check does not block merging (macOS arm64 runners are scarce).
# Other variants (debug, C++20, no OpenMP, MSVC, and make nomulti) are in nightly.yml.
#
# Frugal CI (NatronGitHub runners are shared by all repos): one run per change.
# Pushes are built only on master, RB-* and tags; feature branches are built
# through their pull request (not twice). Draft pull requests are not built:
# CI starts when the PR is marked ready. Superseded runs are cancelled, except
# for tags. Jobs time out.
on:
  push:
    branches: [master, 'RB-*']
    tags: ['*']
    paths-ignore:
      - Documentation/**
      - '**/*.md'
      - LICENSE
      - README-hosts.txt
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - Documentation/**
      - '**/*.md'
      - LICENSE
      - README-hosts.txt
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned to a commit SHA (version in the comment), since
# a tag can be moved to other code. GitHub's own actions/* stay on version tags.
# Checkouts use persist-credentials: false: no step needs to push.

# One run per PR or branch; a new push cancels the previous run, except for tags.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # CMake options shared by the release builds: C++17 (OFX_CXX_STANDARD, the
  # default: the standard of Natron RB-2.6, Qt5; C++20 is built by nightly.yml),
  # OpenMP (OFX_USE_OPENMP, the default; not on macOS, see MACOS_OPTIONS), and the Test bundle.
  CMAKE_OPTIONS: -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
  # The release bundles are uploaded as artifacts only for manual runs
  # ("Run workflow" on the Actions page) and for pre-release tags. This repo is
  # tagged with the Natron version (Natron-2.5.0, Natron-2.0.0-RC1,
  # Natron-2.3.16-beta2), so a pre-release tag is a Natron-* tag that contains
  # -rc, -beta or -alpha. contains() is case-insensitive, so -RC1 matches too.
  # Final releases such as Natron-2.5.0 do not match.
  UPLOAD_ARTIFACTS: >-
    ${{ github.event_name == 'workflow_dispatch' ||
    (github.ref_type == 'tag' && startsWith(github.ref_name, 'Natron-') &&
    (contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha'))) }}

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  build_macos:
    name: Build macOS 15 (arm64)
    # macOS arm64 runners are scarce: start only once Linux and Windows have
    # passed. Merging only requires Linux and Windows; macOS is informative here
    # and is also built nightly (nightly.yml).
    needs: [build_linux, build_windows]
    # no CI for draft pull requests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 30
    # GitHub-hosted arm64 (Apple silicon) runner. The plugins are built with
    # the system Xcode clang and SDK, and only need the system OpenGL
    # framework. MacPorts (never Homebrew) provides the other tools.
    runs-on: macos-15
    env:
      # The bundles load on macOS 11 and later (by default, the SDK version).
      # No OpenMP (as the make CI): the bundles are deployed (OFX_DEPLOY_BUNDLES, osxDeploy.sh),
      # and MacPorts' libomp is built for the runner's macOS (minos 15), so bundles with it
      # would not load on macOS 11 to 14.
      MACOS_OPTIONS: -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DOFX_DEPLOY_BUNDLES=ON -DOFX_USE_OPENMP=OFF
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install MacPorts (cached), CMake, GNU sed and libomp
        # gsed is needed by openfx/Support/include/osxDeploy.sh, which
        # packages the release bundles. See .github/parameters/setup-macports.yaml.
        uses: melusina-org/setup-macports@103eded5f10979e927bffcd6d0b86cbbdb2c3bb3 # v1.1.6
        with:
          parameters: .github/parameters/setup-macports.yaml
      - name: Use MacPorts, not Homebrew
        run: |
          PATH=$(printf '%s' "$PATH" | tr ':' '\n' | grep -v -e '^/opt/homebrew' -e '^/usr/local/' | paste -sd: -)
          echo "PATH=/opt/local/bin:/opt/local/sbin:$PATH" >> "$GITHUB_ENV"
      - name: Show tools
        run: |
          echo "PATH=$PATH"
          command -v c++ gsed cmake
          c++ --version
          cmake --version
      - name: Build (release)
        run: |
          cmake -S . -B build $CMAKE_OPTIONS $MACOS_OPTIONS
          cmake --build build --parallel "$(getconf _NPROCESSORS_ONLN)"
          cmake --install build --prefix "$PWD/install"
      - name: Load test
        run: .github/tools/loadtest.sh install
      - name: Collect bundles
        if: env.UPLOAD_ARTIFACTS == 'true'
        # Not Test: it is installed (BUILD_TESTING=ON) for the load test, but it is for
        # developers, and is not uploaded.
        run: |
          mkdir -p Bundle
          mv install/OFX/Plugins/{CImg,Misc,Shadertoy}.ofx.bundle Bundle
      - name: Upload artifacts
        if: env.UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: openfx-misc-build-macos-release
          path: Bundle

  build_linux:
    name: Build Ubuntu 24.04
    # no CI for draft pull requests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Ubuntu system packages
        # libexpat1-dev: openfx's HostSupport (hostDemo) uses the system expat
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa-dev libgl-dev libexpat1-dev cmake ninja-build
      - name: Build (release)
        # OFX_BUILD_HOSTDEMO: openfx's hostDemo, in install/bin, for the render tests
        run: |
          cmake -S . -B build -G Ninja $CMAKE_OPTIONS -DOFX_BUILD_HOSTDEMO=ON
          cmake --build build
          cmake --install build --prefix "$PWD/install"
      - name: Load test
        run: .github/tools/loadtest.sh install
      - name: Render test (hostDemo)
        # Renders the generators and some filters at the three depths, and checks
        # the outputs (21 s in CI).
        timeout-minutes: 10
        run: .github/tools/rendertest.sh install
      - name: Smoke test (hostDemo, all plug-ins)
        # Renders every plug-in with its default parameters, in its most general
        # context (--quick: general, else filter; nightly.yml renders both), at each
        # supported depth (38 s in CI).
        timeout-minutes: 10
        run: .github/tools/smoketest.sh --quick install
      - name: Collect bundles
        if: env.UPLOAD_ARTIFACTS == 'true'
        # Not Test: it is installed (BUILD_TESTING=ON) for the load test, but it is for
        # developers, and is not uploaded.
        run: |
          mkdir -p Bundle
          mv install/OFX/Plugins/{CImg,Misc,Shadertoy}.ofx.bundle Bundle
      - name: Upload artifacts
        if: env.UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: openfx-misc-build-ubuntu_24-release
          path: Bundle

  build_windows:
    name: Build Windows (MSYS2 UCRT64)
    # no CI for draft pull requests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 30
    runs-on: windows-2022
    defaults:
      run:
        # The msys2 shell has no pipefail option, so each run block starts
        # with "set -eo pipefail".
        shell: msys2 {0}
    env:
      # The MinGW runtime (libstdc++, libgcc, winpthread) is linked statically, so
      # that the bundles also load in hosts that do not ship these DLLs (loadtest.sh
      # checks it). No OpenMP (as the make CI): with MSYS2's libgomp, -static still
      # leaves a libgomp-1.dll dependency (rejected by loadtest.sh, CI run 44066372220).
      WINDOWS_OPTIONS: -DCMAKE_MODULE_LINKER_FLAGS=-static -DOFX_USE_OPENMP=OFF
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Setup MSYS2 UCRT64 environment (cached)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          # Same options as nightly.yml, so that both share one cache (its key
          # is derived from these options). update: false: see nightly.yml.
          update: false
          cache: true
          # pacboy: the packages of the msystem (UCRT64), without hard-coded prefixes
          install: git base-devel
          pacboy: cc:p cmake:p ninja:p
      - name: Build (release)
        run: |
          set -eo pipefail
          cmake -S . -B build -G Ninja $CMAKE_OPTIONS $WINDOWS_OPTIONS
          cmake --build build
          cmake --install build --prefix "$PWD/install"
      - name: Load test
        run: |
          set -eo pipefail
          .github/tools/loadtest.sh install
      - name: Collect bundles
        if: env.UPLOAD_ARTIFACTS == 'true'
        # Not Test: it is installed (BUILD_TESTING=ON) for the load test, but it is for
        # developers, and is not uploaded.
        run: |
          set -eo pipefail
          mkdir -p Bundle
          mv install/OFX/Plugins/{CImg,Misc,Shadertoy}.ofx.bundle Bundle
      - name: Upload artifacts
        if: env.UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: openfx-misc-build-windows-release
          path: Bundle
