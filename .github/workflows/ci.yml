name: Continous Integration tests

# Every pull request and push to master gets exactly three builds (macOS, Linux, Windows)
# of the release configuration, followed by a plugin load test.
# Other variants (debug, nomulti, C++23, OpenMP, CMake) are in nightly.yml.
on:
  # Pushes are only built on master and tags: other branches are built by their
  # pull request, so that a PR branch is not built twice.
  push:
    branches: [master]
    tags: ['*']
    paths-ignore:
      - Documentation/**
      - '**/*.md'
      - LICENSE
      - README-hosts.txt
  pull_request:
    paths-ignore:
      - Documentation/**
      - '**/*.md'
      - LICENSE
      - README-hosts.txt
  workflow_dispatch:

permissions:
  contents: read

# One run per branch or PR. Superseded PR runs are cancelled, but every push to
# master is built to completion, so each merge gets a CI result.
# (github.job is empty at workflow level, so it is not part of the group.)
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The release bundles are uploaded as artifacts only for manual runs
  # ("Run workflow" on the Actions page) and for pre-release tags. This repo is
  # tagged with the Natron version (Natron-2.5.0, Natron-2.0.0-RC1,
  # Natron-2.3.16-beta2), so a pre-release tag is a Natron-* tag that contains
  # -rc, -beta or -alpha. contains() is case-insensitive, so -RC1 matches too.
  # Final releases such as Natron-2.5.0 do not match.
  UPLOAD_ARTIFACTS: >-
    ${{ github.event_name == 'workflow_dispatch' ||
    (github.ref_type == 'tag' && startsWith(github.ref_name, 'Natron-') &&
    (contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha'))) }}

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  build_macos:
    name: Build macOS 15 (arm64)
    # GitHub-hosted arm64 (Apple silicon) runner. The plugins are built with
    # the system Xcode clang and SDK, and only need the system OpenGL
    # framework. MacPorts (never Homebrew) provides the other tools.
    runs-on: macos-15
    env:
      # By default, the Makefiles use the SDK version as the minimum macOS
      # version, so that the bundles would only load on macOS 15 and later.
      MACOS_OPTIONS: MACOSX=11.0
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install MacPorts (cached) and GNU sed
        # gsed is needed by openfx/Support/include/osxDeploy.sh, which
        # packages the release bundles. See .github/parameters/setup-macports.yaml.
        uses: melusina-org/setup-macports@v1.1.6
        with:
          parameters: .github/parameters/setup-macports.yaml
      - name: Use MacPorts, not Homebrew
        run: |
          PATH=$(printf '%s' "$PATH" | tr ':' '\n' | grep -v -e '^/opt/homebrew' -e '^/usr/local/' | paste -sd: -)
          echo "PATH=/opt/local/bin:/opt/local/sbin:$PATH" >> "$GITHUB_ENV"
      - name: Show tools
        run: |
          echo "PATH=$PATH"
          command -v c++ gsed
          c++ --version
      - name: Build (release)
        run: make -j"$(getconf _NPROCESSORS_ONLN)" CONFIG=release TESTS=1 $MACOS_OPTIONS
      - name: Load test
        run: .github/tools/loadtest.sh
      - name: Collect bundles
        if: env.UPLOAD_ARTIFACTS == 'true'
        # Not Test: it is for developers, and is never installed.
        run: |
          mkdir -p Bundle
          mv {CImg,Misc,Shadertoy}/Darwin-64-release/*.ofx.bundle Bundle
      - name: Upload artifacts
        if: env.UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: openfx-misc-build-macos-release
          path: Bundle

  build_linux:
    name: Build Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Ubuntu system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa-dev libgl-dev
      - name: Build (release)
        run: make -j"$(nproc)" CONFIG=release TESTS=1
      - name: Load test
        run: .github/tools/loadtest.sh
      - name: Collect bundles
        if: env.UPLOAD_ARTIFACTS == 'true'
        # Not Test: it is for developers, and is never installed.
        run: |
          mkdir -p Bundle
          mv {CImg,Misc,Shadertoy}/Linux-64-release/*.ofx.bundle Bundle
      - name: Upload artifacts
        if: env.UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: openfx-misc-build-ubuntu_24-release
          path: Bundle

  build_windows:
    name: Build Windows (MSYS2 UCRT64)
    runs-on: windows-2022
    defaults:
      run:
        # The msys2 shell has no pipefail option, so each run block starts
        # with "set -eo pipefail".
        shell: msys2 {0}
    env:
      # Options shared by the release builds. The MinGW runtime (libstdc++,
      # libgcc, winpthread) is linked statically, so that the bundles also
      # load in hosts that do not ship these DLLs.
      RELEASE_OPTIONS: CONFIG=release LDFLAGS_ADD=-static
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup MSYS2 UCRT64 environment (cached)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: git base-devel mingw-w64-ucrt-x86_64-cc
      - name: Build (release)
        run: |
          set -eo pipefail
          make -j"$(nproc)" $RELEASE_OPTIONS TESTS=1
      - name: Load test
        run: |
          set -eo pipefail
          .github/tools/loadtest.sh
      - name: Collect bundles
        if: env.UPLOAD_ARTIFACTS == 'true'
        # Not Test: it is for developers, and is never installed.
        run: |
          set -eo pipefail
          mkdir -p Bundle
          mv {CImg,Misc,Shadertoy}/MINGW64*-release/*.ofx.bundle Bundle
      - name: Upload artifacts
        if: env.UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: openfx-misc-build-windows-release
          path: Bundle
