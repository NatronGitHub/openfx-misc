name: Continous Integration tests

on:
  push:
    paths-ignore:
      - LICENSE
      - README.md
      - README-hosts.txt
  pull_request:
    paths-ignore:
      - LICENSE
      - README.md
      - README-hosts.txt

concurrency:
  group: ${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build_linux:
    name: Build Ubuntu 22.04
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Install Ubuntu system packages
        run: |
          sudo apt update
          sudo apt-get install libglu1-mesa-dev libgl-dev
      - name: Build (release)
        run: |
          make -j2 CONFIG=release TESTS=1
          mkdir -p Bundle
          mv {CImg,Misc,Shadertoy,Test}/Linux-64-release/*.ofx.bundle Bundle
      - name: Build (debug)
        run: |
          make -j2 CONFIG=debug
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openfx-misc-build-ubuntu_22-release
          path: Bundle
  build_windows:
    name: Build Windows
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Setup MinGW environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git base-devel mingw-w64-x86_64-cc
      - name: Build (release)
        # link the MinGW runtime (libstdc++, libgcc, winpthread) statically so
        # that the bundles also load in hosts that do not ship these DLLs
        run: |
          make -j2 CONFIG=release TESTS=1 LDFLAGS_ADD=-static
          mkdir -p Bundle
          mv {CImg,Misc,Shadertoy,Test}/MINGW64*-release/*.ofx.bundle Bundle
      - name: Build separate plugins (release, nomulti)
        run: |
          make -j2 nomulti CONFIG=release LDFLAGS_ADD=-static
          mkdir -p BundleNoMulti
          mv */MINGW64*-release/*.ofx.bundle CImg/*/MINGW64*-release/*.ofx.bundle BundleNoMulti
      - name: Build (debug)
        run: |
          make -j2 CONFIG=debug
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openfx-misc-build-windows-release
          path: Bundle
      - name: Upload separate plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openfx-misc-build-windows-nomulti-release
          path: BundleNoMulti
