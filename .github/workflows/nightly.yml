name: Nightly extra builds

# Build variants that are not worth running on every push or pull request
# (ci.yml only builds the CMake release configuration on each OS), with CMake:
# debug, C++20 (Natron RB-2.6 with Qt6, and RB-2.7; ci.yml builds C++17),
# without OpenMP (ci.yml uses it if found), and Windows MSVC, plus the macOS
# release build of ci.yml, which there only runs after Linux and Windows pass
# (this covers master when the push run's macOS job was skipped or cancelled).
# The Makefiles are still built, with one bundle per plugin (make nomulti), on
# Linux and Windows, as long as Natron's build-plugins.sh uses them.
# Each build is followed by the same plugin load test as in ci.yml.
# The render test of ci.yml (Linux release) also runs after the macOS release
# and the Linux debug builds (debug: with the plugins' assertions). It is not
# run on Windows: hostDemo is built with the openfx Makefiles, which do not
# support MSYS2.
# Frugal CI: the nightly run is skipped if master did not change since the last
# nightly run that succeeded or failed (a cancelled run does not count), and jobs
# time out.
on:
  schedule:
    - cron: '17 3 * * *' # every day at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

# A new run cancels a run of the same branch still in progress, so that two
# runs of these jobs never compete for runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  # Skip the scheduled run if it would build the same commit as the last
  # successful scheduled run. Manual runs always build.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            # last scheduled run that built or failed (not cancelled): a known failure
            # is not rebuilt every night until master changes (use workflow_dispatch to retry)
            last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?event=schedule&status=completed&per_page=20" \
                     --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")][0].head_sha // empty')
          fi
          if [ -n "$last" ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No change since the last nightly run ($last): skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: macOS 15 ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 30
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          # OpenMP: Apple clang uses the MacPorts libomp (OFX_USE_OPENMP, the default).
          - name: release # the macOS build of ci.yml
            config: release
            options: -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DOFX_DEPLOY_BUNDLES=ON
            rendertest: true
          - name: debug
            config: debug
            options: -DCMAKE_BUILD_TYPE=Debug
          - name: C++20
            config: release
            options: -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=20
          - name: no OpenMP
            config: release
            options: -DCMAKE_BUILD_TYPE=Release -DOFX_USE_OPENMP=OFF
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install MacPorts (cached), CMake, GNU sed and libomp
        uses: melusina-org/setup-macports@103eded5f10979e927bffcd6d0b86cbbdb2c3bb3 # v1.1.6
        with:
          parameters: .github/parameters/setup-macports.yaml
      - name: Use MacPorts, not Homebrew
        run: |
          PATH=$(printf '%s' "$PATH" | tr ':' '\n' | grep -v -e '^/opt/homebrew' -e '^/usr/local/' | paste -sd: -)
          echo "PATH=/opt/local/bin:/opt/local/sbin:$PATH" >> "$GITHUB_ENV"
      - name: Build
        # The install directory name ends with the configuration: rendertest.sh
        # expects the debug assertions when it ends with -debug.
        run: |
          cmake -S . -B build -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 ${{ matrix.options }}
          cmake --build build --parallel "$(getconf _NPROCESSORS_ONLN)"
          cmake --install build --prefix "$PWD/install-${{ matrix.config }}"
      - name: Load test
        run: .github/tools/loadtest.sh install-${{ matrix.config }}
      - name: Render test (hostDemo)
        if: matrix.rendertest
        timeout-minutes: 10
        run: .github/tools/rendertest.sh install-${{ matrix.config }}

  linux:
    name: Ubuntu 24.04 ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug
            config: debug
            options: -DCMAKE_BUILD_TYPE=Debug
            rendertest: true
          - name: C++20
            config: release
            options: -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=20
          - name: no OpenMP
            config: release
            options: -DCMAKE_BUILD_TYPE=Release -DOFX_USE_OPENMP=OFF
          # the Makefiles, while Natron's build-plugins.sh uses them
          - name: make nomulti
            make: nomulti CONFIG=release
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Ubuntu system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa-dev libgl-dev cmake ninja-build
      - name: Build (make)
        if: matrix.make
        run: make -j"$(nproc)" ${{ matrix.make }}
      - name: Build (CMake)
        if: ${{ !matrix.make }}
        # The install directory name ends with the configuration: rendertest.sh
        # expects the debug assertions when it ends with -debug.
        run: |
          cmake -S . -B build -G Ninja ${{ matrix.options }}
          cmake --build build
          cmake --install build --prefix "$PWD/install-${{ matrix.config }}"
      - name: Load test
        # make: the source tree; CMake: the install tree
        run: .github/tools/loadtest.sh ${{ matrix.make && ' ' || format('install-{0}', matrix.config) }}
      - name: Render test (hostDemo)
        if: matrix.rendertest
        timeout-minutes: 10
        run: .github/tools/rendertest.sh install-${{ matrix.config }}

  windows:
    name: Windows (MSYS2 UCRT64) ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 60
    runs-on: windows-2022
    defaults:
      run:
        # The msys2 shell has no pipefail option, so each run block starts
        # with "set -eo pipefail".
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          # -static everywhere: loadtest.sh fails on a MinGW runtime DLL dependency.
          - name: debug
            config: debug
            options: -DCMAKE_BUILD_TYPE=Debug -DCMAKE_MODULE_LINKER_FLAGS=-static
          - name: C++20
            config: release
            options: -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=20 -DCMAKE_MODULE_LINKER_FLAGS=-static
          # the Makefiles, while Natron's build-plugins.sh uses them (GCC's default, gnu++17)
          - name: make nomulti
            make: nomulti CONFIG=release LDFLAGS_ADD=-static
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Setup MSYS2 UCRT64 environment (cached)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          # No full system upgrade (pacman -Syuu) before installing: it makes
          # each nightly run download and re-cache most of MSYS2. The packages
          # below are still installed at their latest version, so the compiler
          # is current; only the MSYS2 base system comes from the action.
          update: false
          cache: true
          # pacboy: the packages of the msystem (UCRT64), without hard-coded prefixes
          install: git base-devel
          pacboy: cc:p cmake:p ninja:p
      - name: Build (make)
        if: matrix.make
        run: |
          set -eo pipefail
          make -j"$(nproc)" ${{ matrix.make }}
      - name: Build (CMake)
        if: ${{ !matrix.make }}
        run: |
          set -eo pipefail
          cmake -S . -B build -G Ninja ${{ matrix.options }}
          cmake --build build
          cmake --install build --prefix "$PWD/install-${{ matrix.config }}"
      - name: Load test
        # make: the source tree; CMake: the install tree
        run: |
          set -eo pipefail
          .github/tools/loadtest.sh ${{ matrix.make && ' ' || format('install-{0}', matrix.config) }}

  # MSVC is not used by the CI's make builds (MinGW GCC), but the CMake build and
  # Misc/*.vcxproj support it: check that the sources build with Visual Studio 2022
  # (C++17, /Zc:__cplusplus from openfx::Api). The build needs nothing beyond the
  # runner image (CMake downloads CImg.h); the load test uses the cached MSYS2 UCRT64.
  windows_msvc:
    name: Windows MSVC 2022 CMake
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 20
    runs-on: windows-2022
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --parallel
          cmake --install build --config Release --prefix "$PWD/cmake-install"
      - name: Setup MSYS2 UCRT64 environment (cached), for the load test
        # the same options as the MSYS2 builds, so that all share one cache
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: false
          cache: true
          install: git base-devel
          pacboy: cc:p cmake:p ninja:p
      - name: Load test
        # ofxload is built with the MSYS2 UCRT64 GCC (loadtest.sh uses GCC options),
        # and objdump is MSYS2's; ofxload only loads the MSVC-built plugins through
        # LoadLibrary (C entry points). This proves the DLLs load and register their
        # plug-ins; it does not call setHost/mainEntry, so the threading code
        # /Zc:__cplusplus switches is not run.
        shell: msys2 {0}
        run: |
          set -eo pipefail
          command -v c++ objdump
          .github/tools/loadtest.sh cmake-install
