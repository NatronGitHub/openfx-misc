name: Nightly extra builds

# Build variants that are not worth running on every push or pull request
# (ci.yml only builds the CMake release configuration on each OS), with CMake:
# debug, C++20 (Natron RB-2.6 with Qt6, and RB-2.7; ci.yml builds C++17),
# without OpenMP (ci.yml uses it on Linux), and Windows MSVC, plus the macOS
# release build of ci.yml, which there only runs after Linux and Windows pass
# (this covers master when the push run's macOS job was skipped or cancelled).
# CI builds with CMake (Natron#1181). The Makefiles are kept as the RB-2.6 fallback: one cheap
# nightly Linux job (make CONFIG=release, the combined bundles, as Natron's fallback builds them)
# checks that they still build; the slow one-bundle-per-plugin "make nomulti" jobs are gone: a
# Linux CMake job builds the separate bundles (OFX_PLUGIN_BUNDLES=SEPARATE) instead.
# Every CMake job passes its C++ standard explicitly (OFX_CXX_STANDARD=17 or 20).
# Each build is followed by the same plugin load test as in ci.yml.
# The Windows MSVC jobs build the downloadable Windows nightlies, for x64 and for Windows on Arm
# (Arm64X), uploaded as the openfx-misc-nightly-windows-msvc-x64 and -arm64x artifacts (30 days).
# On demand, "only: windows-msvc" runs just them, and cimg_patches, which always runs
# (gh workflow run nightly.yml -f only=windows-msvc).
# The CImg plug-ins: ci.yml builds their default FFT (pocketfft); here, Linux FFTW builds the opt-in
# FFT=fftw3 (GPL) with the render tests, and macOS OpenMP is FFT=pow2. The cimg_patches job checks that CImg.h is still patched as openfx-gmic's.
# The render and smoke tests of ci.yml (Linux release) also run after the macOS
# release and the Linux debug builds (debug: with the plugins' assertions), with
# hostDemo built by -DOFX_BUILD_HOSTDEMO=ON. On Windows (MSYS2 CMake builds), only the
# CImgConvolve render test runs (RENDERTEST_ONLY), as a check of the pocketfft unload
# deadlock (POCKETFFT_NO_MULTITHREADING); smoketest.sh does not run on Windows.
# Frugal CI: the nightly run is skipped if master did not change since the last
# nightly run that succeeded or failed (a cancelled run does not count), and jobs
# time out.
on:
  schedule:
    - cron: '17 3 * * *' # every day at 03:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "all: every job; windows-msvc: only the Windows MSVC jobs (windows_msvc, windows_msvc_arm), and cimg_patches (a few seconds, it always runs)"
        type: choice
        options: [ all, windows-msvc ]
        default: all

permissions:
  contents: read

# A new run cancels a run of the same branch still in progress, so that two
# runs of these jobs never compete for runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  # Skip the scheduled run if it would build the same commit as the last
  # successful scheduled run. Manual runs always build.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
      # the Windows MSVC jobs: also with "only: windows-msvc"
      msvc: ${{ steps.check.outputs.msvc }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
        run: |
          last=
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            # last scheduled run that built or failed (not cancelled): a known failure
            # is not rebuilt every night until master changes (use workflow_dispatch to retry)
            last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?event=schedule&status=completed&per_page=20" \
                     --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")][0].head_sha // empty')
          fi
          run=true
          if [ -n "$last" ] && [ "$last" = "$GITHUB_SHA" ]; then
            run=false
            echo "No change since the last nightly run ($last): skipping."
          fi
          msvc=$run
          if [ "$ONLY" = windows-msvc ]; then run=false msvc=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "msvc=$msvc" >> "$GITHUB_OUTPUT"

  # CImg.h is patched as openfx-gmic's (CImg/CImgVersion.mk): check that CImg/patches are still
  # byte-identical to openfx-gmic's patches at master, that they are applied in the same order,
  # that the pocketfft pin is the same, and that CIMGVERSION is the CImg tag of its GMICVER (a few
  # seconds, no build). It runs every night, without needs: changes, since the drift it catches
  # comes from openfx-gmic, not from this repository.
  cimg_patches:
    name: CImg.h patches (openfx-gmic)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Compare with openfx-gmic master
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/tools/check-cimg-patches.sh master

  macos:
    name: macOS 15 ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 30
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          # release: the macOS build of ci.yml (deployed, no OpenMP: MacPorts' libomp has
          # minos 15, so deployed bundles with it would not load on macOS 14).
          - name: release # the macOS build of ci.yml
            config: release
            options: -DOFX_CXX_STANDARD=17 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DOFX_DEPLOY_BUNDLES=ON -DOFX_USE_OPENMP=OFF -DOFX_BUILD_HOSTDEMO=ON
            rendertest: true
          - name: debug
            config: debug
            options: -DOFX_CXX_STANDARD=17 -DCMAKE_BUILD_TYPE=Debug
          - name: C++20
            config: release
            options: -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=20
          # OpenMP: Apple clang with the MacPorts libomp (not deployed). FFT=pow2: CImg's own FFT
          # (no FFT library), the configuration of the rare builds without one.
          - name: OpenMP pow2
            config: release
            options: -DOFX_CXX_STANDARD=17 -DCMAKE_BUILD_TYPE=Release -DFFT=pow2
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install MacPorts (cached), CMake, GNU sed and libomp
        uses: melusina-org/setup-macports@103eded5f10979e927bffcd6d0b86cbbdb2c3bb3 # v1.1.6
        with:
          parameters: .github/parameters/setup-macports.yaml
      - name: Use MacPorts, not Homebrew
        run: |
          PATH=$(printf '%s' "$PATH" | tr ':' '\n' | grep -v -e '^/opt/homebrew' -e '^/usr/local/' | paste -sd: -)
          echo "PATH=/opt/local/bin:/opt/local/sbin:$PATH" >> "$GITHUB_ENV"
      - name: Build
        # The bundles are installed in install-<config>/OFX/Plugins.
        run: |
          cmake -S . -B build ${{ matrix.options }}
          cmake --build build --parallel "$(getconf _NPROCESSORS_ONLN)"
          cmake --install build --prefix "$PWD/install-${{ matrix.config }}"
      - name: Load test
        run: .github/tools/loadtest.sh install-${{ matrix.config }}
      - name: Render test (hostDemo)
        if: matrix.rendertest
        timeout-minutes: 10
        run: |
          [ "${{ matrix.config }}" != debug ] || export RENDERTEST_DEBUG=1
          .github/tools/rendertest.sh install-${{ matrix.config }}
      - name: Smoke test (hostDemo, all plug-ins)
        if: matrix.rendertest
        timeout-minutes: 15
        run: |
          [ "${{ matrix.config }}" != debug ] || export SMOKETEST_DEBUG=1
          .github/tools/smoketest.sh install-${{ matrix.config }}

  linux:
    name: Ubuntu 24.04 ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # debug: the full smoke test of the -O0 build (with OpenMP) is much slower
    timeout-minutes: ${{ matrix.config == 'debug' && 75 || 30 }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug
            config: debug
            options: -DOFX_CXX_STANDARD=17 -DCMAKE_BUILD_TYPE=Debug -DOFX_BUILD_HOSTDEMO=ON
            rendertest: true
          # C++20, with the render tests
          - name: C++20
            config: release
            options: -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=20 -DBUILD_TESTING=ON -DOFX_BUILD_HOSTDEMO=ON
            rendertest: true
          # OpenMP (GCC's libgomp)
          - name: OpenMP
            config: release
            options: -DOFX_CXX_STANDARD=17 -DCMAKE_BUILD_TYPE=Release
          # the opt-in FFTW (FFT=fftw3, GPL only, Ubuntu's libfftw3-dev), with the render tests
          # (the FFT convolution test of rendertest.sh)
          - name: FFTW
            config: release
            options: -DOFX_CXX_STANDARD=17 -DCMAKE_BUILD_TYPE=Release -DFFT=fftw3 -DBUILD_TESTING=ON -DOFX_BUILD_HOSTDEMO=ON
            rendertest: true
            packages: libfftw3-dev pkg-config
          # one bundle per plug-in ("make nomulti"): OFX_PLUGIN_BUNDLES=SEPARATE, load test only
          # (each bundle links its own SupportExt sources: a missing one is an undefined symbol,
          # which a Linux module only shows when loaded)
          - name: separate bundles
            config: separate
            options: -DOFX_CXX_STANDARD=17 -DCMAKE_BUILD_TYPE=Release -DOFX_PLUGIN_BUNDLES=SEPARATE
            # the plug-ins (identifier and version) of Misc, CImg and Shadertoy in a release build:
            # no plug-in is lost in the split (update when a plug-in is added or removed)
            plugins: 212
          # the Makefiles, as Natron RB-2.6's Linux fallback builds them: combined bundles, with
          # OpenMP (OPENMP=1), GCC's default standard (gnu++17)
          - name: make
            make: CONFIG=release OPENMP=1
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Ubuntu system packages
        # libexpat1-dev: openfx's HostSupport (hostDemo, debug) uses the system expat
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa-dev libgl-dev libexpat1-dev cmake ninja-build ${{ matrix.packages }}
      - name: Build (make)
        if: matrix.make
        run: make -j"$(nproc)" ${{ matrix.make }}
      - name: Build (CMake)
        if: ${{ !matrix.make }}
        # The bundles are installed in install-<config>/OFX/Plugins.
        run: |
          cmake -S . -B build -G Ninja ${{ matrix.options }}
          cmake --build build
          cmake --install build --prefix "$PWD/install-${{ matrix.config }}"
      - name: Load test
        # make: the source tree; CMake: the install tree. matrix.plugins: the expected number of
        # plug-ins (ofxload's "<n> binaries, <m> plugins, <e> errors")
        run: |
          set -o pipefail
          .github/tools/loadtest.sh ${{ matrix.make && ' ' || format('install-{0}', matrix.config) }} | tee loadtest.log
          if [ -n "${{ matrix.plugins }}" ]; then
            n=$(sed -n 's/^[0-9]* binaries, \([0-9]*\) plugins, .*/\1/p' loadtest.log | head -n 1)
            [ "$n" = "${{ matrix.plugins }}" ] || { echo "::error::$n plug-ins, expected ${{ matrix.plugins }}"; exit 1; }
          fi
      - name: Render test (hostDemo)
        if: matrix.rendertest
        timeout-minutes: 10
        run: |
          [ "${{ matrix.config }}" != debug ] || export RENDERTEST_DEBUG=1
          .github/tools/rendertest.sh install-${{ matrix.config }}
      - name: Smoke test (hostDemo, all plug-ins)
        if: matrix.rendertest
        # debug (-O0): SMOKETEST_DEBUG=1 for the "debug:" entries, and 600 s per render
        # (CImg plug-ins at -O0, with OpenMP)
        timeout-minutes: ${{ matrix.config == 'debug' && 50 || 15 }}
        run: |
          [ "${{ matrix.config }}" != debug ] || export SMOKETEST_DEBUG=1 SMOKETEST_TIMEOUT=600
          .github/tools/smoketest.sh install-${{ matrix.config }}

  windows:
    name: Windows (MSYS2 UCRT64) ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 60
    runs-on: windows-2022
    defaults:
      run:
        # The msys2 shell has no pipefail option, so each run block starts
        # with "set -eo pipefail".
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          # -static everywhere: loadtest.sh fails on a MinGW runtime DLL dependency.
          # No OpenMP: -static still leaves a libgomp-1.dll dependency (see ci.yml).
          - name: debug
            config: debug
            options: -DOFX_CXX_STANDARD=17 -DCMAKE_BUILD_TYPE=Debug -DCMAKE_MODULE_LINKER_FLAGS=-static -DOFX_USE_OPENMP=OFF -DOFX_BUILD_HOSTDEMO=ON
          - name: C++20
            config: release
            options: -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=20 -DCMAKE_MODULE_LINKER_FLAGS=-static -DOFX_USE_OPENMP=OFF -DOFX_BUILD_HOSTDEMO=ON
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Setup MSYS2 UCRT64 environment (cached)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          # No full system upgrade (pacman -Syuu) before installing: it makes
          # each nightly run download and re-cache most of MSYS2. The packages
          # below are still installed at their latest version, so the compiler
          # is current; only the MSYS2 base system comes from the action.
          update: false
          cache: true
          # pacboy: the packages of the msystem (UCRT64), without hard-coded prefixes
          install: git base-devel
          pacboy: cc:p cmake:p ninja:p expat:p python:p
      - name: Build (CMake)
        run: |
          set -eo pipefail
          cmake -S . -B build -G Ninja ${{ matrix.options }}
          cmake --build build
          cmake --install build --prefix "$PWD/install-${{ matrix.config }}"
      - name: Load test
        run: |
          set -eo pipefail
          .github/tools/loadtest.sh install-${{ matrix.config }}
      - name: Render test (hostDemo, FFT convolution)
        # as ci.yml: a hang at hostDemo's exit (pocketfft's thread pool, openfx-gmic#94) fails
        # at the step timeout (hostDemo from -DOFX_BUILD_HOSTDEMO=ON).
        timeout-minutes: 5
        run: |
          set -eo pipefail
          RENDERTEST_ONLY='^CImgConvolve' .github/tools/rendertest.sh install-${{ matrix.config }}

  # Windows MSVC: the downloadable Windows nightlies (#203). They are built with MSVC, since users
  # also run them in third-party hosts; only the OSMesa Shadertoy stays on MSYS2 UCRT64
  # (release.yml). .github/tools/msvc-build.sh (also run by ci.yml for arm64x) builds Misc, CImg,
  # Shadertoy (OpenGL) and the standalone DenoiseSharpen with CMake and Ninja (C++17), with the
  # static CRT (CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded: no vcruntime DLL to ship) and without
  # OpenMP (if it is ever enabled, vcomp140.dll must be pinned and shipped app-local, as
  # openfx-gmic#108: see the script), and checks each binary with dumpbin (machine type, no
  # MSVC runtime DLL). Both run on windows-2025, whose Visual Studio 2022 has the ARM64 and
  # ARM64EC cross tools:
  # - x64: Contents/Win64, load-tested here, with an ofxload built by cl;
  # - arm64x: Microsoft's Arm64X recipe (cmake/OFXMiscArm64X.cmake): an ARM64 build, then an
  #   Arm64EC build linked with its objects into Arm64X binaries, in Contents/Win-arm64ec (Arm64EC
  #   hosts, and the x64 hosts emulated on Windows on Arm that look there), plus the ARM64 binaries
  #   in Contents/Win-arm64 (native ARM64 hosts; a reserved folder). Load-tested on windows-11-arm
  #   (windows_msvc_arm below).
  # The downloads are packaged as release.yml's (package-release.sh: the full set, Shadertoy
  # (OpenGL) and DenoiseSharpen, each a zip with README.txt, LICENSE.txt and LICENSES/), and
  # uploaded as openfx-misc-nightly-windows-msvc-<arch>, kept 30 days (a scheduled run is skipped
  # when master did not change, so the last downloads must outlive a quiet week).
  windows_msvc:
    name: Windows MSVC ${{ matrix.arch }}
    needs: changes
    if: needs.changes.outputs.msvc == 'true'
    # arm64x: two builds
    timeout-minutes: ${{ matrix.arch == 'x64' && 25 || 45 }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msvc: x64
            platform: windows-x86_64-msvc
          - arch: arm64x
            msvc: amd64_arm64 # the ARM64 cross tools (cl -arm64EC: Arm64EC)
            platform: windows-arm64x-msvc
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up MSVC (${{ matrix.msvc }})
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.msvc }}
      - name: Build
        # (in Git for Windows' bash, whose sh patches CImg.h)
        run: .github/tools/msvc-build.sh ${{ matrix.arch }} msvc
      - name: Load test
        # x64 only (the Arm binaries don't run here): ofxload built with cl (x64, /MT)
        if: matrix.arch == 'x64'
        run: |
          cl -nologo -EHsc -W3 -Iopenfx/include .github/tools/ofxload.cpp -Fe:ofxload.exe
          OFXLOAD=./ofxload.exe .github/tools/loadtest.sh msvc/install
          OFXLOAD=./ofxload.exe .github/tools/loadtest.sh msvc/install-denoisesharpen
      - name: Package
        run: |
          .github/tools/package-release.sh --platform ${{ matrix.platform }} --out dist \
              --full msvc/install/OFX/Plugins --shadertoy-gl msvc/install/OFX/Plugins \
              --denoisesharpen msvc/install-denoisesharpen/OFX/Plugins
      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: openfx-misc-nightly-windows-msvc-${{ matrix.arch }}
          path: dist
          if-no-files-found: error
          retention-days: 30
          compression-level: 0 # (zip files)

  # The Windows on Arm load test of the arm64x downloads (windows_msvc), on windows-11-arm: each
  # download (the full set, Shadertoy, DenoiseSharpen) is loaded by an ARM64 ofxload from
  # Win-arm64 (the ARM64 binaries) and from Win-arm64ec (the Arm64X binaries, their ARM64 code),
  # and by an Arm64EC ofxload from Win-arm64ec (their Arm64EC code), with ofxload built by cl.
  # (Only when both windows_msvc builds pass.)
  windows_msvc_arm:
    name: Windows on Arm MSVC load test (ARM64, Arm64X)
    needs: windows_msvc
    timeout-minutes: 15
    runs-on: windows-11-arm
    steps:
      - name: Checkout branch
        # (openfx's headers for ofxload, and the scripts)
        uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - name: Set up MSVC (ARM64)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: arm64
      - name: Download the arm64x downloads
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: openfx-misc-nightly-windows-msvc-arm64x
          path: dist
      - name: Unzip
        shell: pwsh
        run: Get-ChildItem dist/*.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath unpacked }
      - name: Load test
        run: |
          cl -nologo -EHsc -W3 -Iopenfx/include .github/tools/ofxload.cpp -Fe:ofxload-arm64.exe
          cl -nologo -EHsc -W3 -arm64EC -Iopenfx/include .github/tools/ofxload.cpp -Fe:ofxload-arm64ec.exe -link -machine:arm64ec
          for e in arm64 arm64ec; do
            echo "ofxload-$e.exe: $(dumpbin -nologo -headers ofxload-$e.exe | tr -d '\r' | grep -m1 ' machine (' | sed 's/^ *//')"
          done
          status=0
          for d in unpacked/*/; do
            for t in arm64:Win-arm64 arm64:Win-arm64ec arm64ec:Win-arm64ec; do
              echo "::group::$d: ofxload-${t%%:*}.exe, ${t##*:}"
              OFXLOAD=./ofxload-${t%%:*}.exe LOADTEST_ARCHDIR=${t##*:} .github/tools/loadtest.sh "$d" || status=1
              echo "::endgroup::"
            done
          done
          exit $status
