# MacPorts setup for the macOS CI jobs (melusina-org/setup-macports).
# Shared by ci.yml and nightly.yml so that both use the same cached
# installation (the cache key is derived from this file).
version: '2.12.7'
prefix: '/opt/local'
ports:
  # GNU sed, needed by openfx/Support/include/osxDeploy.sh (release bundles)
  - name: gsed
  # OpenMP runtime for Apple clang (OFX_USE_OPENMP, the CMake default)
  - name: libomp
  # CMake (the runner's /usr/local/bin/cmake is not on PATH: MacPorts only)
  - name: cmake
  # expat for openfx's HostSupport (hostDemo: OFX_BUILD_HOSTDEMO). MacPorts' cmake already
  # depends on it; FindEXPAT prefers it to the SDK's. hostDemo is not deployed, so its
  # minimum macOS does not matter.
  - name: expat
