[pytest]
# The Resolve tests start DaVinci Resolve, a GUI application (see
# README.md): without --launch-resolve, --ofx-prefix (or $OFX_PREFIX) and
# a Resolve that accepts external scripting, every test is skipped.
addopts = -p no:cacheprovider
markers =
    resolve: renders with DaVinci Resolve (tests/resolve)
