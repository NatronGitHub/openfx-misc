<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="100%" height="100%" viewBox="0 0 128 128" version="1.1" xmlns="http://www.w3.org/2000/svg" xml:space="preserve" style="fill-rule:evenodd;clip-rule:evenodd;stroke-miterlimit:10;">
    <defs>
        <!-- the colors of black body radiators from about 2000 K (left) to 12000 K (right) -->
        <linearGradient id="temperature" x1="0" y1="0" x2="128" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%" style="stop-color:#ff8912;stop-opacity:1"/>
            <stop offset="25%" style="stop-color:#ffb46b;stop-opacity:1"/>
            <stop offset="50%" style="stop-color:#fff4ed;stop-opacity:1"/>
            <stop offset="75%" style="stop-color:#cfdaff;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#a6bcff;stop-opacity:1"/>
        </linearGradient>
    </defs>
    <g id="WhiteBalance">
        <rect x="0.5" y="0.5" width="127" height="127" style="fill:url(#temperature);fill-rule:nonzero;"/>
        <!-- the neutral patch: a white square with a gray square inside -->
        <rect x="39" y="39" width="50" height="50" style="fill:#ffffff;stroke-width:3px;stroke:#000;"/>
        <rect x="52" y="52" width="24" height="24" style="fill:#808080;"/>
        <rect x="0.5" y="0.5" width="127" height="127" style="fill:none;stroke-width:1px;stroke:#000;"/>
    </g>
</svg>
